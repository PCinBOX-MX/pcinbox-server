version: '3.8'

services:
  pcinbox-server-dev:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env.local

  pcinbox-server-qa:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CMD: build
    command: npm run qa
    ports:
      - "8000:8000"
    env_file:
      - .env.local

  pcinbox-server-prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CMD: build
    command: npm run prod
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
